<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style id="css">
:root{
  --bg:#f2f4f5;
  --panel:#ffffff;
  --ink:#17242a;
  --ink-soft:#5a6b72;
  --line:#d8dfe2;
  --accent:#0a7d8c;
  --accent-ink:#ffffff;
  --accent-soft:#e0f0f2;
  --ok:#1a7f4b;
  --warn:#b3541e;
  --danger:#b02a37;
  --hit:#fff3c4;
  --hit-ink:#5c4a00;
  --shadow:0 1px 3px rgba(23,36,42,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a1e;
    --panel:#18262c;
    --ink:#e6edf0;
    --ink-soft:#93a6ad;
    --line:#2b3d45;
    --accent:#31a8b8;
    --accent-ink:#08161a;
    --accent-soft:#123840;
    --ok:#4cc783;
    --warn:#e08a4d;
    --danger:#e06974;
    --hit:#4a3f10;
    --hit-ink:#ffe484;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101a1e;
  --panel:#18262c;
  --ink:#e6edf0;
  --ink-soft:#93a6ad;
  --line:#2b3d45;
  --accent:#31a8b8;
  --accent-ink:#08161a;
  --accent-soft:#123840;
  --ok:#4cc783;
  --warn:#e08a4d;
  --danger:#e06974;
  --hit:#4a3f10;
  --hit-ink:#ffe484;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  min-height:100vh;
}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
header.top{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:16px;
}
h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.datainfo{font-size:.85rem;color:var(--ink-soft)}
.datainfo button{
  background:none;border:none;color:var(--accent);font:inherit;
  cursor:pointer;text-decoration:underline;padding:0;
}

/* Search */
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px}
.searchbox{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:2px solid var(--line);border-radius:10px;
  padding:0 14px;box-shadow:var(--shadow);
  transition:border-color .15s;
}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox svg{flex:none;color:var(--ink-soft)}
.searchbox input{
  flex:1;border:none;background:none;color:var(--ink);
  font:inherit;font-size:1.1rem;padding:14px 0;outline:none;min-width:0;
}
.searchbox input::placeholder{color:var(--ink-soft)}
.clearbtn{
  flex:none;border:none;background:var(--line);color:var(--ink);
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  font-size:.95rem;line-height:1;display:none;
}
.searchbox.hasval .clearbtn{display:block}
.rescount{font-size:.85rem;color:var(--ink-soft);min-height:1.2em}
.resrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.toggle{font-size:.85rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.groups{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:6px;margin:4px 0 14px;
}
.gchip{
  display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--panel);
  padding:9px 12px;font:inherit;font-size:.92rem;color:var(--ink);cursor:pointer;
  text-align:left;user-select:none;min-width:0;
}
.gchip .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip .n{font-size:.8rem;color:var(--ink-soft);flex:none}
.gchip .box{
  flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;line-height:1;
}
.gchip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.gchip.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gchip.all{grid-column:1 / -1}
.gchip.all.on{background:var(--panel)}

/* Loader panel */
.loader{
  background:var(--panel);border:2px dashed var(--line);border-radius:12px;
  padding:40px 20px;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.loader.drag{border-color:var(--accent);background:var(--accent-soft)}
.loader h2{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.loader p{color:var(--ink-soft);font-size:.9rem;margin-bottom:16px}
.btn{
  display:inline-block;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:8px;padding:11px 22px;
  font:inherit;font-weight:600;cursor:pointer;
}
.btn[disabled]{opacity:.6;cursor:default}
.btn:focus-visible,.searchbox input:focus-visible,button:focus-visible,select:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px;
}
.btn.ghost{
  background:none;color:var(--accent);border:1.5px solid var(--accent);
  padding:9px 18px;font-weight:600;
}
input[type=file]{display:none}
.loadmsg{margin-top:14px;font-size:.9rem;color:var(--danger);min-height:1.2em}

/* Mapping panel */
.mapping{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow);margin-top:16px;
}
.mapping h2{font-size:1.05rem;font-weight:600;margin-bottom:4px}
.mapping .sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:16px}
.maprow{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.maprow label{font-weight:600;font-size:.92rem}
.maprow select{
  width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;
}
.pricechips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);border-radius:20px;
  padding:6px 14px;font-size:.9rem;cursor:pointer;user-select:none;
  background:var(--bg);
}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
:root[data-theme="dark"] .chip.on{color:var(--ink)}
.mapping .actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pubmsg{font-size:.9rem;color:var(--ink-soft);width:100%;min-height:1.2em}
.pubmsg.err{color:var(--danger)}

/* Results */
.results{margin-top:4px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
}
.card .code{
  font-family:"Barlow Semi Condensed","Barlow",sans-serif;
  font-weight:600;font-size:1rem;color:var(--accent);
  word-break:break-all;
}
.card .desc{margin:4px 0 10px;font-size:.98rem}
.card .meta{
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;
  border-top:1px solid var(--line);padding-top:10px;
}
.metaitem .k{font-size:.75rem;color:var(--ink-soft);display:block}
.metaitem .v{font-family:"Barlow Semi Condensed","Barlow",sans-serif;font-weight:600;font-size:1.05rem}
.card.multi{border-left:4px solid var(--accent)}
.gsummary{font-size:.85rem;color:var(--ink-soft);margin:-4px 0 8px}
.gsummary span{font-weight:600}
.avgbox{
  display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;
  background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:10px;
}
.avglabel{font-size:.85rem;font-weight:600;color:var(--accent);width:100%}
:root[data-theme="dark"] .avglabel{color:var(--ink)}
.variants{border-top:1px solid var(--line)}
.variant{
  display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:6px 16px;
  align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
}
.variant:last-child{border-bottom:none;padding-bottom:0}
.variant .meta{border-top:none;padding-top:0}
.vbrand{font-weight:600;font-size:.98rem}
.vdesc{font-weight:400;font-size:.85rem;color:var(--ink-soft);margin-top:2px}
@media(max-width:480px){
  .variant{grid-template-columns:1fr}
}
.stock-ok{color:var(--ok)}
.stock-low{color:var(--warn)}
.stock-out{color:var(--danger)}
mark{background:var(--hit);color:var(--hit-ink);border-radius:3px;padding:0 1px}
.more{
  width:100%;background:none;border:1.5px dashed var(--line);border-radius:10px;
  color:var(--ink-soft);font:inherit;padding:12px;cursor:pointer;margin-top:4px;
}
.empty{
  text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:.95rem;
}
.notice{
  background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin:10px 0 16px;
  font-size:.92rem;line-height:1.5;
}
.notice .btn{margin-top:10px}
.hidden{display:none !important}
@media(min-width:560px){
  .maprow{grid-template-columns:160px 1fr}
}
</style>
</head>

<template id="body-src">
<div class="wrap">

  <header class="top">
    <h1>Buscador de inventario</h1>
    <div class="datainfo" id="dataInfo"></div>
  </header>

  <!-- Paso 1: cargar archivo (solo el dueño) -->
  <div class="loader hidden" id="loader" role="button" tabindex="0" aria-label="Cargar archivo de inventario">

    <p>Arrastra el archivo aquí o tócalo para elegirlo (.xlsx, .xls o .csv).<br>Al confirmar se genera la página actualizada con el inventario adentro.</p>
    <span class="btn">Elegir archivo</span>
    <div class="loadmsg" id="loadMsg"></div>
  </div>

  <!-- Paso 2: mapear columnas -->
  <div class="mapping hidden" id="mapping">
    <h2>Confirma las columnas</h2>

    <div class="maprow" id="sheetRow" style="display:none">
      <label for="selSheet">Hoja</label>
      <select id="selSheet"></select>
    </div>
    <div class="maprow">
      <label for="selHeader">Fila de títulos</label>
      <select id="selHeader"></select>
    </div>
    <div class="maprow">
      <label for="selCode">Código</label>
      <select id="selCode"></select>
    </div>
    <div class="maprow">
      <label for="selDesc">Descripción</label>
      <select id="selDesc"></select>
    </div>
    <div class="maprow">
      <label for="selBrand">Marca</label>
      <select id="selBrand"></select>
    </div>
    <div class="maprow">
      <label for="selGroup">Grupo</label>
      <select id="selGroup"></select>
    </div>
    <div class="maprow">
      <label for="selStock">Existencia</label>
      <select id="selStock"></select>
    </div>
    <div class="maprow" style="align-items:start">
      <label style="padding-top:8px">Precios</label>
      <div class="pricechips" id="priceChips"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnConfirm">Generar página actualizada</button>
      <button class="btn ghost" id="btnCancelMap">Cargar otro archivo</button>
      <div class="pubmsg" id="pubMsg"></div>
    </div>
  </div>

  <!-- Paso 3: buscar -->
  <div class="hidden" id="searchArea">
    <div class="searchbar">
      <div class="searchbox" id="searchBox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Código, marca, grupo o palabras de la descripción…" aria-label="Buscar en el inventario">
        <button class="clearbtn" id="btnClear" aria-label="Borrar búsqueda">✕</button>
      </div>
      <div class="resrow">
        <div class="rescount" id="resCount"></div>
        <label class="toggle"><input type="checkbox" id="chkOut"> Mostrar agotados</label>
      </div>
    </div>
    <div class="groups hidden" id="groups" role="group" aria-label="Filtrar por grupo"></div>
    <div class="results" id="results"></div>
  </div>

  <div class="notice hidden" id="dlNotice"></div>
  <div class="empty hidden" id="noData">El inventario todavía no ha sido cargado.</div>

</div>
</template>

  items: [],       // {code, desc, brand, stock, prices:[{label,val}], _s}
  fileName: "", loadedAt: null, workbook: null, shown: PAGE,
  canWrite: false, artifactApi: null,
  selGroups: []     // grupos seleccionados; vacío = todos
};

var $ = function(id){ return document.getElementById(id); };
var loader=$("loader"), fileInput=$("fileInput"), loadMsg=$("loadMsg"),
    mapping=$("mapping"), searchArea=$("searchArea"), q=$("q"),
    results=$("results"), resCount=$("resCount"), dataInfo=$("dataInfo"),
    searchBox=$("searchBox"), pubMsg=$("pubMsg"), noData=$("noData");

/* ---------- utilidades ---------- */
function norm(s){
  return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toNum(v){
  if(v == null || v === "") return NaN;
  return typeof v === "number" ? v : parseFloat(String(v).replace(/[^0-9.,-]/g,"").replace(",","."));
}
function fmtPrice(v){
  if(v == null || v === "") return "—";
  var n = toNum(v);
  if(isNaN(n)) return esc(String(v));
  return "$" + n.toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtStock(v){
  if(v == null || v === "") return {txt:"—", cls:""};
  var n = toNum(v);
  if(isNaN(n)) return {txt:esc(String(v)), cls:""};
  var cls = n <= 0 ? "stock-out" : (n <= 3 ? "stock-low" : "stock-ok");
  return {txt:n.toLocaleString("es-VE"), cls:cls};
}

/* ---------- grupos que no son productos (filas de cálculo del Excel) ---------- */
var EXCLUDED_GROUPS = ["calculo","devaluacion","ganancia","gasto","pago","vendedores"];
function isExcludedGroup(g){
  var n = norm(g);
  if(!n) return false;
  for(var i=0;i<EXCLUDED_GROUPS.length;i++){ if(n.indexOf(EXCLUDED_GROUPS[i])!==-1) return true; }
  return false;
}

/* ---------- datos embebidos en la página ---------- */
function readEmbedded(){
  try{
    var raw = document.getElementById("inv-data").textContent;
    var d = JSON.parse(raw);
    if(!d || !d.items || !d.items.length) return false;
    var labels = d.labels || [];
    state.items = d.items.map(function(r){
      var code=r[0]||"", desc=r[1]||"", brand=r[2]||"", stock=r[3], pv=r[4]||[], group=r[5]||"";
      return {code:code, desc:desc, brand:brand, stock:stock, group:group,
        prices: labels.map(function(l,i){ return {label:l, val:pv[i]}; }),
        _s: norm(code)+" "+norm(desc)+" "+norm(brand)+" "+norm(group)};
    }).filter(function(it){ return !isExcludedGroup(it.group); });
    state.map = {code:0, desc:1, brand:2, stock: d.hasStock ? 3 : -1, group: d.hasGroup ? 5 : -1,
                 prices: labels.map(function(l,i){return {idx:i,label:l};})};
    state.fileName = d.fileName || "inventario";
    state.loadedAt = d.loadedAt ? new Date(d.loadedAt) : null;
    return true;
  }catch(e){ return false; }
}

function serializeData(){
  var labels = state.map.prices.map(function(p){ return p.label; });
  return {
    labels: labels,
    hasStock: state.map.stock >= 0,
    hasGroup: state.map.group >= 0,
    fileName: state.fileName,
    loadedAt: state.loadedAt ? state.loadedAt.toISOString() : null,
    items: state.items.map(function(it){
      return [it.code, it.desc, it.brand, it.stock == null ? null : it.stock,
              it.prices.map(function(p){ return p.val == null ? null : p.val; }),
              it.group || ""];
    })
  };
}

// Reconstruye la página completa (misma estructura con la que fue escrita) con los datos nuevos
function buildPage(data){
  var json = JSON.stringify(data).replace(/<\//g, "<\\/");
  var css = document.getElementById("css").textContent;
  var body = document.getElementById("body-src").innerHTML;
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n'
    + '<meta charset="UTF-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + '<title>Buscador de inventario</title>\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
    + '<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">\n'
    + '<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n'
    + '<style id="css">' + css + '</style>\n'
    + '</head>\n<body>\n'
    + '<template id="body-src">' + body + '</template>\n'
    + '<script id="inv-data" type="application/json">' + json + '<\/script>\n'
    + '<script id="app">' + APP_SRC + '<\/script>\n'
    + '</body>\n</html>\n';
}

/* ---------- carga de archivo ---------- */
function openPicker(){ fileInput.click(); }
loader.addEventListener("click", openPicker);
loader.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();openPicker();} });
["dragover","dragenter"].forEach(function(ev){
  loader.addEventListener(ev,function(e){e.preventDefault();loader.classList.add("drag");});
});
["dragleave","drop"].forEach(function(ev){
  loader.addEventListener(ev,function(e){e.preventDefault();loader.classList.remove("drag");});
});
loader.addEventListener("drop",function(e){
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) readFile(f);
});
fileInput.addEventListener("change",function(){
  if(fileInput.files[0]) readFile(fileInput.files[0]);
  fileInput.value = "";
});

function readFile(file){
  loadMsg.textContent = "";
  if(typeof XLSX === "undefined"){
    loadMsg.textContent = "No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página.";
    return;
  }
  var reader = new FileReader();
  reader.onerror = function(){ loadMsg.textContent = "No se pudo leer el archivo. Intenta de nuevo."; };
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:"array"});
      state.workbook = wb;
      state.fileName = file.name;
      state.loadedAt = new Date();
      setupSheetSelect(wb);
      useSheet(wb.SheetNames[0]);
    }catch(err){
      loadMsg.textContent = "El archivo no se pudo interpretar como hoja de cálculo. Verifica que sea .xlsx, .xls o .csv.";
    }
  };
  reader.readAsArrayBuffer(file);
}

function setupSheetSelect(wb){
  var row = $("sheetRow"), sel = $("selSheet");
  if(wb.SheetNames.length > 1){
    sel.innerHTML = wb.SheetNames.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+"</option>";}).join("");
    row.style.display = "";
    sel.onchange = function(){ useSheet(sel.value); };
  } else {
    row.style.display = "none";
  }
}

function useSheet(name, headerRow){
  var ws = state.workbook.Sheets[name];
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  state.rawRows = rows;
  var hIdx;
  if(typeof headerRow === "number"){
    hIdx = headerRow;
  } else {
    // fila de encabezado: entre las primeras 10, la que tenga más celdas de texto
    hIdx = 0; var best = -1;
    for(var i=0;i<Math.min(rows.length,10);i++){
      var textCells = (rows[i]||[]).filter(function(c){return typeof c==="string" && c.trim()!=="";}).length;
      if(textCells > best){ best = textCells; hIdx = i; }
    }
  }
  state.headerRow = hIdx;
  state.headers = (rows[hIdx]||[]).map(function(h,i){ return h==null||String(h).trim()==="" ? "Columna "+(i+1) : String(h).trim(); });
  state.rows = rows.slice(hIdx+1).filter(function(r){
    return r && r.some(function(c){ return c!=null && String(c).trim()!==""; });
  });
  buildHeaderSelect(rows, hIdx, name);
  buildMapping();
}

function buildHeaderSelect(rows, hIdx, sheetName){
  var sel = $("selHeader");
  var n = Math.min(rows.length, 10);
  var opts = [];
  for(var i=0;i<n;i++){
    var preview = (rows[i]||[]).filter(function(c){return c!=null && String(c).trim()!=="";})
                  .slice(0,4).map(function(c){return String(c).trim();}).join(" | ");
    if(preview.length > 60) preview = preview.substr(0,60) + "…";
    opts.push('<option value="'+i+'">Fila '+(i+1)+(preview ? ": "+esc(preview) : " (vacía)")+"</option>");
  }
  sel.innerHTML = opts.join("");
  sel.value = hIdx;
  sel.onchange = function(){ useSheet(sheetName, parseInt(sel.value,10)); };
}

/* ---------- deteccion y mapeo de columnas ---------- */
function detect(patterns){
  for(var i=0;i<state.headers.length;i++){
    var h = norm(state.headers[i]);
    for(var p=0;p<patterns.length;p++){
      if(h.indexOf(patterns[p]) !== -1) return i;
    }
  }
  return -1;
}
function detectAll(patterns, excludeIdx, excludePatterns){
  var out = [];
  for(var i=0;i<state.headers.length;i++){
    if(excludeIdx.indexOf(i)!==-1) continue;
    var h = norm(state.headers[i]);
    var skip = false;
    for(var x=0;x<(excludePatterns||[]).length;x++){
      if(h.indexOf(excludePatterns[x]) !== -1){ skip = true; break; }
    }
    if(skip) continue;
    for(var p=0;p<patterns.length;p++){
      if(h.indexOf(patterns[p]) !== -1){ out.push(i); break; }
    }
  }
  return out;
}

function buildMapping(){
  var codeIdx  = detect(["codigo","cod.","sku","referencia","ref","item","articulo nro","numero de parte","n\u00b0 parte","part"]);
  var descIdx  = detect(["descripcion","descrip","producto","nombre","detalle","articulo"]);
  var brandIdx = detect(["marca","brand","fabricante","proveedor"]);
  var groupIdx = detect(["grupo","categoria","familia","linea","rubro","clase"]);
  var stockIdx = detect(["existencia","exist","stock","cantidad","cant","disponible","inventario","unidades"]);
  var priceIdxs = detectAll(["precio","pvp","venta","detal","mayor","mercado","mostrador","tienda","usd","price","$"],[codeIdx,descIdx,brandIdx,groupIdx,stockIdx],["costo","cost","total"]);

  var optHtml = '<option value="-1">— (ninguna)</option>' + state.headers.map(function(h,i){
    return '<option value="'+i+'">'+esc(h)+"</option>";
  }).join("");
  $("selCode").innerHTML = optHtml;  $("selCode").value  = codeIdx;
  $("selDesc").innerHTML = optHtml;  $("selDesc").value  = descIdx;
  $("selBrand").innerHTML = optHtml; $("selBrand").value = brandIdx;
  $("selGroup").innerHTML = optHtml; $("selGroup").value = groupIdx;
  $("selStock").innerHTML = optHtml; $("selStock").value = stockIdx;

  var chips = $("priceChips");
  chips.innerHTML = state.headers.map(function(h,i){
    var on = priceIdxs.indexOf(i)!==-1;
    return '<span class="chip'+(on?" on":"")+'" data-i="'+i+'" role="checkbox" aria-checked="'+on+'" tabindex="0">'+esc(h)+"</span>";
  }).join("");
  Array.prototype.forEach.call(chips.children,function(ch){
    function toggle(){ ch.classList.toggle("on"); ch.setAttribute("aria-checked", ch.classList.contains("on")); }
    ch.addEventListener("click",toggle);
    ch.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();} });
  });

  pubMsg.textContent = ""; pubMsg.classList.remove("err");
  $("btnConfirm").disabled = false;
  loader.classList.add("hidden");
  searchArea.classList.add("hidden");
  noData.classList.add("hidden");
  mapping.classList.remove("hidden");
}

$("btnCancelMap").addEventListener("click",function(){
  mapping.classList.add("hidden");
  loader.classList.remove("hidden");
});

$("btnConfirm").addEventListener("click",function(){
  var code = parseInt($("selCode").value,10);
  var desc = parseInt($("selDesc").value,10);
  var brand = parseInt($("selBrand").value,10);
  var group = parseInt($("selGroup").value,10);
  var stock = parseInt($("selStock").value,10);
  var prices = [];
  Array.prototype.forEach.call($("priceChips").children,function(ch){
    if(ch.classList.contains("on")){
      var i = parseInt(ch.getAttribute("data-i"),10);
      prices.push({idx:i, label:state.headers[i]});
    }
  });
  state.map = {code:code, desc:desc, brand:brand, group:group, stock:stock, prices:prices};
  buildItems();
  publishNow();
});

function publishNow(){
  var btn = $("btnConfirm");
  var api = state.artifactApi;
  if(!api){
    // Fuera de Claude: generar el archivo HTML actualizado para descargarlo y subirlo/enviarlo
    var html = buildPage(serializeData());
    showSearch();
    offerDownload(html);
    return;
  }
  btn.disabled = true;
  pubMsg.classList.remove("err");
  pubMsg.textContent = "Publicando " + state.items.length.toLocaleString("es-VE") + " artículos para el equipo…";
  var html = buildPage(serializeData());
  api.publish(html).then(function(){
    pubMsg.textContent = "Publicado. Actualizando…";
    // La página se recarga sola con la nueva versión.
  }).catch(function(err){
    var code = err && err.code;
    btn.disabled = false;
    pubMsg.classList.add("err");
    if(code === "conflict"){
      pubMsg.textContent = "Alguien publicó una versión nueva hace un momento. La página se actualizará; vuelve a cargar tu archivo si aún hace falta.";
    } else if(code === "not_writer" || code === "not_granted" || code === "not_declared"){
      pubMsg.textContent = "Esta vista es de solo lectura: no se puede publicar desde aquí. Los datos quedan disponibles solo en esta sesión.";
      state.canWrite = false;
      showSearch();
    } else if(code === "too_large"){
      pubMsg.textContent = "El inventario es demasiado grande para publicarlo en la página. Prueba quitando columnas o filas que no necesites.";
    } else if(code === "rate_limited"){
      pubMsg.textContent = "Se publicó demasiadas veces seguidas. Espera un momento e intenta de nuevo.";
    } else {
      pubMsg.textContent = "No se pudo publicar (" + (code || "error") + "). Intenta de nuevo en unos segundos.";
    }
  });
}

function offerDownload(html){
  var box = $("dlNotice");
  var blob = new Blob([html], {type:"text/html;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var n = state.items.length.toLocaleString("es-VE");
  box.innerHTML = "<strong>Página actualizada lista</strong> con " + n + " artículos. "
    + "Descárgala y reemplaza la anterior donde la tengas alojada, o envíala al equipo. "
    + "Mientras tanto ya puedes buscar aquí abajo.<br>"
    + '<a class="btn" id="dlLink" href="'+url+'" download="index.html">Descargar index.html</a> '
    + '<button class="btn ghost" id="dlClose" type="button">Cerrar</button>';
  box.classList.remove("hidden");
  $("dlClose").addEventListener("click",function(){ box.classList.add("hidden"); URL.revokeObjectURL(url); });
  var wrap = document.querySelector(".wrap");
  wrap.insertBefore(box, searchArea);
}

/* ---------- normalizar items ---------- */
function buildItems(){
  var m = state.map;
  state.items = state.rows.map(function(r){
    var code = m.code>=0 ? r[m.code] : "";
    var desc = m.desc>=0 ? r[m.desc] : "";
    var brand = (m.brand!=null && m.brand>=0) ? r[m.brand] : "";
    var group = (m.group!=null && m.group>=0) ? r[m.group] : "";
    var stock = m.stock>=0 ? r[m.stock] : null;
    var prices = m.prices.map(function(p){ return {label:p.label, val:r[p.idx]}; });
    return {
      code: code==null?"":String(code).trim(),
      desc: desc==null?"":String(desc).trim(),
      brand: brand==null?"":String(brand).trim(),
      group: group==null?"":String(group).trim(),
      stock: stock,
      prices: prices,
      _s: norm(code) + " " + norm(desc) + " " + norm(brand) + " " + norm(group)
    };
  }).filter(function(it){ return (it.code !== "" || it.desc !== "") && !isExcludedGroup(it.group); });
}

/* ---------- busqueda ---------- */
function tokens(str){
  return norm(str).split(/\s+/).filter(function(t){return t!=="";});
}
function inStock(it){
  if(state.map.stock < 0) return true;
  var n = toNum(it.stock);
  return !isNaN(n) && n > 0;
}
function stockItems(){
  return $("chkOut").checked ? state.items : state.items.filter(inStock);
}
// nombres para mostrar (clave = nombre normalizado, sin espacios alrededor de puntos)
var GROUP_NAMES = {
  "v.expansion": "VALVULA DE EXPANSION",
  "v.poa": "VALVULA POA"
};
function gkey(g){
  return norm(g).replace(/\s*\.\s*/g,".").replace(/\s+/g," ").trim();
}
function inSelectedGroup(it){
  if(state.selGroups.length===0) return true;
  return state.selGroups.indexOf(gkey(it.group)) !== -1;
}
function visibleItems(){
  return stockItems().filter(inSelectedGroup);
}
function hasGroups(){ return state.map && state.map.group >= 0; }
function renderGroups(){
  var box = $("groups");
  if(!hasGroups()){ box.classList.add("hidden"); return; }
  // contar por grupo entre los artículos (con o sin agotados, según el interruptor)
  var counts = {}, names = {}, nameVotes = {};
  stockItems().forEach(function(it){
    var k = gkey(it.group);
    if(!counts[k]){ counts[k]=0; nameVotes[k] = {}; }
    counts[k]++;
    var label = it.group || "Sin grupo";
    nameVotes[k][label] = (nameVotes[k][label]||0) + 1;
  });
  // el nombre mostrado es la variante más frecuente en el Excel
  Object.keys(nameVotes).forEach(function(k){
    var best = "", bestN = -1;
    Object.keys(nameVotes[k]).forEach(function(l){ if(nameVotes[k][l] > bestN){ bestN = nameVotes[k][l]; best = l; } });
    names[k] = GROUP_NAMES[k] || best;
  });
  var keys = Object.keys(counts).sort(function(a,b){ return names[a].localeCompare(names[b],"es"); });
  if(keys.length===0){ box.classList.add("hidden"); return; }
  var allOn = state.selGroups.length===0;
  var html = '<button type="button" class="gchip all'+(allOn?" on":"")+'" data-g="" aria-pressed="'+allOn+'">'
    + '<span class="box">'+(allOn?"✓":"")+'</span><span class="name">Todos los grupos</span>'
    + '<span class="n">'+stockItems().length.toLocaleString("es-VE")+"</span></button>";
  html += keys.map(function(k){
    var on = state.selGroups.indexOf(k)!==-1;
    return '<button type="button" class="gchip'+(on?" on":"")+'" data-g="'+esc(k)+'" aria-pressed="'+on+'">'
      + '<span class="box">'+(on?"✓":"")+'</span><span class="name">'+esc(names[k])+'</span>'
      + '<span class="n">'+counts[k].toLocaleString("es-VE")+"</span></button>";
  }).join("");
  box.innerHTML = html;
  box.classList.remove("hidden");
  Array.prototype.forEach.call(box.children,function(b){
    b.addEventListener("click",function(){
      var g = b.getAttribute("data-g");
      if(g===""){ state.selGroups = []; }
      else {
        var i = state.selGroups.indexOf(g);
        if(i===-1) state.selGroups.push(g); else state.selGroups.splice(i,1);
      }
      state.shown = PAGE;
      render();
    });
  });
}
function search(query){
  var tk = tokens(query);
  var base = visibleItems();
  if(tk.length===0) return base;
  return base.filter(function(it){
    for(var i=0;i<tk.length;i++){
      if(it._s.indexOf(tk[i]) === -1) return false;
    }
    return true;
  });
}
function highlight(text, tk){
  var safe = esc(text);
  if(tk.length===0) return safe;
  var plain = text, out = "", i = 0;
  var np = norm(plain);
  while(i < plain.length){
    var matched = 0;
    for(var t=0;t<tk.length;t++){
      if(np.substr(i, tk[t].length) === tk[t]){ matched = tk[t].length; break; }
    }
    if(matched){
      out += "<mark>" + esc(plain.substr(i,matched)) + "</mark>";
      i += matched;
    } else {
      out += esc(plain.charAt(i));
      i++;
    }
  }
  return out;
}

function groupByCode(list){
  var groups = [], byCode = {};
  list.forEach(function(it){
    var key = norm(it.code);
    if(key === ""){ groups.push({code:it.code, desc:it.desc, variants:[it]}); return; }
    if(byCode[key]){ byCode[key].variants.push(it); }
    else { byCode[key] = {code:it.code, desc:it.desc, variants:[it]}; groups.push(byCode[key]); }
  });
  return groups;
}
function sumStock(variants){
  var total = 0, any = false;
  variants.forEach(function(v){
    var n = toNum(v.stock);
    if(!isNaN(n)){ total += n; any = true; }
  });
  return any ? total : null;
}
function avgPrices(variants){
  var acc = {}, order = [];
  variants.forEach(function(v){
    v.prices.forEach(function(p){
      var n = toNum(p.val);
      if(isNaN(n) || n <= 0) return;
      if(!acc[p.label]){ acc[p.label] = {sum:0,count:0}; order.push(p.label); }
      acc[p.label].sum += n; acc[p.label].count++;
    });
  });
  return order.map(function(label){
    return {label:label, avg: acc[label].sum / acc[label].count, count: acc[label].count};
  });
}

function render(){
  var query = q.value;
  var tk = tokens(query);
  var found = search(query);
  var groups = groupByCode(found);
  var total = groups.length;
  var slice = groups.slice(0, state.shown);
  var hasStock = state.map.stock>=0;
  renderGroups();

  if(state.items.length===0){
    results.innerHTML = '<div class="empty">El archivo no tiene filas con datos en las columnas elegidas.</div>';
    resCount.textContent = "";
    return;
  }
  if(total===0){
    var hiddenHits = $("chkOut").checked ? 0 : state.items.filter(function(it){
      if(inStock(it) || !inSelectedGroup(it)) return false;
      for(var i=0;i<tk.length;i++){ if(it._s.indexOf(tk[i])===-1) return false; }
      return true;
    }).length;
    var scope = state.selGroups.length ? " en " + (state.selGroups.length===1 ? "el grupo seleccionado" : "los grupos seleccionados") : "";
    results.innerHTML = '<div class="empty">Sin resultados con existencia' + scope + (tk.length ? ' para «'+esc(query)+'»' : '') + '.'
      + (hiddenHits ? "<br>Hay "+hiddenHits+(hiddenHits===1?" artículo agotado":" artículos agotados")+" con esa búsqueda; activa «Mostrar agotados» para verlos." : "<br>Prueba con menos palabras o revisa el código.")
      + "</div>";
    resCount.textContent = "0 resultados";
    return;
  }

  var vis = visibleItems();
  var hiddenCount = state.items.filter(inSelectedGroup).length - vis.length;
  resCount.textContent = (tk.length
    ? total.toLocaleString("es-VE") + (total===1?" código":" códigos") + " · " + found.length.toLocaleString("es-VE") + (found.length===1?" artículo":" artículos")
    : (function(){ var gc=groupByCode(vis).length; return gc.toLocaleString("es-VE") + (gc===1?" código · ":" códigos · ") + vis.length.toLocaleString("es-VE") + (vis.length===1?" artículo con existencia":" artículos con existencia"); })()
      + (state.selGroups.length ? " en " + state.selGroups.length + (state.selGroups.length===1?" grupo":" grupos") : ""))
    + (hiddenCount > 0 && !$("chkOut").checked ? " · " + hiddenCount.toLocaleString("es-VE") + " agotados ocultos" : "");

  function metaFor(it){
    var st = fmtStock(it.stock);
    var priceHtml = it.prices.map(function(p){
      return '<span class="metaitem"><span class="k">'+esc(p.label)+'</span><span class="v">'+fmtPrice(p.val)+"</span></span>";
    }).join("");
    var stockHtml = hasStock
      ? '<span class="metaitem"><span class="k">Existencia</span><span class="v '+st.cls+'">'+st.txt+"</span></span>"
      : "";
    return priceHtml + stockHtml;
  }

  var html = slice.map(function(g){
    var head = '<div class="code">'+ (g.code ? highlight(g.code,tk) : "—") +"</div>"
             + '<div class="desc">'+ highlight(g.desc,tk) +"</div>";

    if(g.variants.length === 1){
      var it = g.variants[0];
      var brandHtml = it.brand
        ? '<span class="metaitem"><span class="k">Marca</span><span class="v">'+highlight(it.brand,tk)+"</span></span>"
        : "";
      return '<div class="card">'+ head + '<div class="meta">'+ brandHtml + metaFor(it) +"</div></div>";
    }

    var totalStock = hasStock ? sumStock(g.variants) : null;
    var totalSt = totalStock==null ? null : fmtStock(totalStock);
    var avgs = avgPrices(g.variants);
    var avgHtml = avgs.length
      ? '<div class="avgbox"><span class="avglabel">Promedio del código</span>'
        + avgs.map(function(a){
            return '<span class="metaitem"><span class="k">'+esc(a.label)+'</span><span class="v">'+fmtPrice(a.avg)+"</span></span>";
          }).join("")
        + "</div>"
      : "";
    var summary = '<div class="gsummary">'
      + g.variants.length + " marcas"
      + (totalSt ? ' · total <span class="'+totalSt.cls+'">'+totalSt.txt+"</span> en existencia" : "")
      + "</div>" + avgHtml;
    var rows = g.variants.map(function(it){
      var altDesc = (norm(it.desc)!==norm(g.desc) && it.desc) ? '<div class="vdesc">'+highlight(it.desc,tk)+"</div>" : "";
      return '<div class="variant">'
        + '<div class="vbrand">'+ (it.brand ? highlight(it.brand,tk) : "Sin marca") + altDesc +"</div>"
        + '<div class="meta">'+ metaFor(it) +"</div>"
        + "</div>";
    }).join("");
    return '<div class="card multi">'+ head + summary + '<div class="variants">'+ rows +"</div></div>";
  }).join("");

  if(total > state.shown){
    html += '<button class="more" id="btnMore">Mostrar más ('+(total-state.shown).toLocaleString("es-VE")+' restantes)</button>';
  }
  results.innerHTML = html;
  var more = $("btnMore");
  if(more) more.addEventListener("click",function(){ state.shown += PAGE; render(); });
}

q.addEventListener("input",function(){
  state.shown = PAGE;
  searchBox.classList.toggle("hasval", q.value!=="");
  render();
});
$("chkOut").addEventListener("change",function(){ state.shown = PAGE; render(); });
$("btnClear").addEventListener("click",function(){
  q.value=""; searchBox.classList.remove("hasval");
  state.shown = PAGE; render(); q.focus();
});

function showSearch(){
  mapping.classList.add("hidden");
  loader.classList.add("hidden");
  noData.classList.add("hidden");
  searchArea.classList.remove("hidden");
  updateInfo();
  state.shown = PAGE;
  render();
}

function updateInfo(){
  if(!state.loadedAt){ dataInfo.innerHTML=""; return; }
  var d = state.loadedAt;
  var when = d.toLocaleDateString("es-VE",{day:"numeric",month:"short"}) + " " +
             d.toLocaleTimeString("es-VE",{hour:"2-digit",minute:"2-digit"});
  dataInfo.innerHTML = "Actualizado " + when
    + (state.canWrite ? ' · <button id="btnReload">Actualizar archivo</button>' : "");
  if(!state.artifactApi && typeof window.claude === "undefined") dataInfo.title = "Genera una página nueva con tu Excel actualizado";
  var b = $("btnReload");
  if(b) b.addEventListener("click",function(){
    searchArea.classList.add("hidden");
    loader.classList.remove("hidden");
    loadMsg.textContent = "";
  });
}

/* ---------- arranque ---------- */
var hasData = readEmbedded();
if(hasData){ showSearch(); }
else { loader.classList.remove("hidden"); }   // sin datos: siempre ofrecer la carga

// Descubrir si esta vista puede publicar (dueño/editor)
(function initPlatform(){
  if(typeof window.claude === "undefined" || typeof window.claude.use !== "function"){
    // Fuera de Claude (archivo alojado en otro sitio): cualquiera puede generar una página nueva
    state.canWrite = true; state.artifactApi = null;
    if(hasData) updateInfo();
    return;
  }
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(res){
    var api = res[0], user = res[1];
    var can = null; // null = no se pudo determinar
    try{ if(user) can = !!(user.isOwner() || user.canEdit()); }catch(e){ can = null; }
    state.artifactApi = api;
    // Si no se pudo determinar, se permite intentar: la publicación dirá si es solo lectura
    state.canWrite = !!api && can !== false;
    if(hasData) updateInfo();
  }).catch(function(){ /* vista de solo lectura */ });
})();
})();
</script>
</body>
</html>
